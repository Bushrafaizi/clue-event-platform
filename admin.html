<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin.js" defer></script>
</head>
<body>
  <div class="container">
    <h2>👤 Admin Login</h2>
    <form id="adminLoginForm">
      <input type="email" id="adminEmail" placeholder="Email" required><br>
      <input type="password" id="adminPassword" placeholder="Password" required><br>
      <button type="submit">Login</button>
    </form>

    <div id="adminPanel" style="display:none;">
      <h3>📋 Admin Dashboard</h3>
      <button onclick="loadParticipants()">View Submissions</button>
      <button onclick="loadClues()">Manage Clues</button>
      <div id="dashboardContent"></div>
    </div>
  </div>
</body>
</html>
