<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Participant Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <h2>👨‍🎓 Participant Registration</h2>

    <form id="registrationForm">
      <input type="text" placeholder="Username" required><br>
      <input type="text" placeholder="College Name" required><br>
      <input type="text" placeholder="Branch" required><br>
      <input type="text" placeholder="Year" required><br>
      <input type="text" placeholder="Registration Number" required><br>
      <button type="submit">Register</button>
    </form>

    <div id="waitingMessage" style="display:none;">
      ⏳ Please wait... Clue will appear in <span id="countdown">600</span> seconds.
    </div>

    <div id="clueBox" style="display:none;">
      <h3>🧩 Clue 1</h3>
      <p id="clueText">Write a function to reverse a string.</p>
      <textarea id="answerBox" rows="5" cols="50" placeholder="Enter your code here..."></textarea><br>
      <button onclick="submitClue()">Submit Clue</button>
    </div>
  </div>
</body>
</html>
